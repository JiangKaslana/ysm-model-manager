<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>YSM Web 解码 Spike（ADR-049 Phase 0）</title>
  <script>
    // Tier 0 权威信号（ADR-049 Phase 1）：本页为纯浏览器环境，强制走 browser adapter
    globalThis.__YSM_BACKEND__ = "browser";
  </script>
  <style>
    :root { color-scheme: dark; }
    body {
      margin: 0; padding: 24px; font-family: system-ui, sans-serif;
      background: #16181d; color: #e6e6e6; min-height: 100vh;
    }
    h1 { font-size: 18px; margin: 0 0 4px; }
    .sub { font-size: 12px; color: #9aa0a6; margin-bottom: 16px; }
    #drop {
      border: 2px dashed #3d4350; border-radius: 12px; padding: 48px 24px;
      text-align: center; cursor: pointer; color: #9aa0a6; transition: border-color .2s;
    }
    #drop.dragover { border-color: #6cb2ff; color: #6cb2ff; }
    #out {
      margin-top: 16px; font-family: ui-monospace, monospace; font-size: 12px;
      white-space: pre-wrap; word-break: break-all; color: #9aa0a6;
    }
    .ok { color: #4ade80; }
    .err { color: #f87171; }
    table { border-collapse: collapse; margin-top: 8px; width: 100%; }
    td, th { border: 1px solid #2a2f3a; padding: 4px 8px; font-size: 12px; text-align: left; }
    th { background: #1e222b; }
  </style>
</head>
<body>
  <h1>🔬 YSMParser WASM — 纯浏览器解码验证</h1>
  <div class="sub">ADR-049 Phase 0 Spike：拖入 .ysm 文件，验证 base64 内嵌 WASM 在无 Wails 壳的浏览器中解码（内存解析路径）。</div>
  <div id="drop">📂 拖拽 .ysm 文件到这里，或点击选择</div>
  <input id="file" type="file" accept=".ysm" style="display:none">
  <div id="out">就绪。加载 WASM 需数秒（首次）。</div>
  <script type="module" src="/src/web-spike/main.ts"></script>
</body>
</html>
