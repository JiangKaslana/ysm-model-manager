name: PR20 Regenerate Bindings

on:
  push:
    branches:
      - fix/pr19-launcher-detection

permissions:
  contents: write

jobs:
  regenerate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: fix/pr19-launcher-detection
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: Install Wails CLI
        run: go install github.com/wailsapp/wails/v3/cmd/wails3@v3.0.0-alpha2.105
      - name: Regenerate TypeScript bindings
        run: npm --prefix frontend run generate:bindings
      - name: Commit generated bindings and remove helper workflow
        shell: bash
        run: |
          rm -f .github/workflows/pr20-regenerate-bindings.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/bindings .github/workflows/pr20-regenerate-bindings.yml
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "chore: regenerate Wails bindings"
          git push origin HEAD:fix/pr19-launcher-detection
