name: PR20 Regenerate Bindings

on:
  push:
    branches:
      - fix/pr19-launcher-detection

permissions:
  contents: write

jobs:
  regenerate:
    if: github.actor != 'github-actions[bot]'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: fix/pr19-launcher-detection
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: Install Wails CLI
        shell: pwsh
        run: go install github.com/wailsapp/wails/v3/cmd/wails3@v3.0.0-alpha2.105
      - name: Regenerate TypeScript bindings
        shell: pwsh
        run: |
          & "$env:USERPROFILE\go\bin\wails3.exe" generate bindings -clean=true -ts -i
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Commit generated bindings and remove helper workflow
        shell: pwsh
        run: |
          Remove-Item -Force .github/workflows/pr20-regenerate-bindings.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/bindings .github/workflows/pr20-regenerate-bindings.yml
          git diff --cached --quiet
          if ($LASTEXITCODE -eq 0) { exit 0 }
          git commit -m "chore: regenerate Wails bindings"
          git push origin HEAD:fix/pr19-launcher-detection
