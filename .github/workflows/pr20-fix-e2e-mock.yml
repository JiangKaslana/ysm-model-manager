name: PR20 Fix E2E Mock

on:
  push:
    branches:
      - fix/pr19-launcher-detection

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: fix/pr19-launcher-detection
      - name: Add launcher binding mock
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('frontend/e2e/mock-data.ts')
          s = p.read_text(encoding='utf-8')
          needle = '  DetectResourceType: "ysm",\n'
          addition = '  DetectLauncherInstances: [],\n'
          if addition not in s:
              if needle not in s:
                  raise SystemExit('mock insertion anchor not found')
              s = s.replace(needle, needle + addition, 1)
              p.write_text(s, encoding='utf-8')
          PY
      - name: Commit patch and remove helper workflow
        shell: bash
        run: |
          rm -f .github/workflows/pr20-fix-e2e-mock.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/e2e/mock-data.ts .github/workflows/pr20-fix-e2e-mock.yml
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "test: mock launcher detection binding"
          git push origin HEAD:fix/pr19-launcher-detection
