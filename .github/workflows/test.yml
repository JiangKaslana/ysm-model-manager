name: Test Gate

# 可复用测试门禁（方案②）：ci.yml（main/PR）与 release.yml（tag 发版）共享，
# 避免 main push 与 tag push 各跑一遍完整测试。
# 版本单点：GO_VERSION / NODE_VERSION / WAILS_VERSION 均读仓库级 Variables。

on:
  workflow_call:

permissions:
  contents: read

env:
  GO_VERSION: ${{ vars.GO_VERSION }}
  NODE_VERSION: ${{ vars.NODE_VERSION }}
  WAILS_VERSION: ${{ vars.WAILS_VERSION }}

jobs:
  test:
    name: 契约测试 + Go 检查 + 前端构建
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}

      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: 缓存 Go 模块（命中免下载）
        uses: actions/cache@v5.1.0
        with:
          path: ${{ runner.os == 'Windows' && '~\go\pkg\mod' || '~/go/pkg/mod' }}
          key: go-mod-${{ runner.os }}-${{ env.WAILS_VERSION }}-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            go-mod-${{ runner.os }}-${{ env.WAILS_VERSION }}-
            go-mod-${{ runner.os }}-

      - name: 契约测试（tests/，Node .mjs，禁止修改测试文件）
        shell: pwsh
        run: |
          $files = Get-ChildItem tests/*.mjs
          foreach ($f in $files) {
            node $f.FullName
            if ($LASTEXITCODE -ne 0) {
              Write-Error "契约测试失败: $($f.Name)（exit=$LASTEXITCODE）"
              exit $LASTEXITCODE
            }
          }

      - name: 绑定契约对账（binding-check — Go 导出 vs -ts 产物）
        shell: pwsh
        run: node scripts/binding-check.mjs

      - name: 绑定产物保鲜（重新生成必须零 diff）
        shell: pwsh
        run: |
          npm --prefix frontend run generate:bindings
          git diff --exit-code -- frontend/bindings
          if ($LASTEXITCODE -ne 0) {
            Write-Error "Go 签名变更但 frontend/bindings 未重新生成/提交"
            exit 1
          }

      - name: ADR 登记一致性（adr-check — G-2 治理门槛）
        shell: pwsh
        run: |
          node scripts/adr-check.mjs | Out-String -Width 200
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: 安装前端依赖
        working-directory: frontend
        shell: pwsh
        run: npm ci

      - name: 构建更新助手 helper（embed 前置，修复 CI 缺 ysm-updater-helper.exe）
        shell: pwsh
        run: go build -ldflags "-X ysm-model-manager/go/version.Version=ci" -o go/updater/ysm-updater-helper.exe ./cmd/updater

      - name: Go 检查（build + vet + test）
        shell: pwsh
        run: |
          go build ./go/...
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          go vet ./go/... ./internal/app/...
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          go test ./go/... ./internal/app/ -count=1 | Out-String -Width 200
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: 前端类型检查（ADR-014 门槛）
        working-directory: frontend
        shell: pwsh
        run: npx tsc --noEmit

      - name: 前端测试（Vitest）
        working-directory: frontend
        shell: pwsh
        run: |
          npx vitest run | Out-String -Width 200
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: 前端构建
        working-directory: frontend
        shell: pwsh
        run: npx vite build

  # ── E2E（Playwright · vite dev 纯前端 + mock bridge，参照 MikuMikuAR 实证模式）──
  # 参数：全局 7 分钟总限 / 每用例 15s / 累计 5 次失败阻断（maxFailures=5）——ADR-037 接入参数。
  # webServer 自动管理 vite dev 生命周期（playwright.config.ts）。
  e2e:
    name: E2E（Playwright）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: 缓存 Playwright 浏览器
        uses: actions/cache@v5.1.0
        with:
          path: ~/.cache/ms-playwright
          key: pw-browsers-${{ runner.os }}-${{ hashFiles('frontend/package-lock.json') }}

      - name: 安装前端依赖
        working-directory: frontend
        run: npm ci

      - name: 安装 Playwright Chromium
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      - name: E2E 测试（7min 总限 / 15s 每项 / maxFailures=5）
        working-directory: frontend
        run: npx playwright test --reporter=line

      - name: 上传 E2E 报告（失败时保留现场）
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: e2e-report
          path: frontend/test-results/
          if-no-files-found: ignore
