<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MMD 渲染验证页（@moeru/three-mmd 独立测试）</title>
<style>
  body { margin:0; font-family: system-ui, sans-serif; background:#1a1b2e; color:#eee; height:100vh; display:flex; flex-direction:column; }
  #bar { padding:8px 12px; background:#262849; display:flex; align-items:center; gap:10px; flex-shrink:0; flex-wrap:wrap; }
  #drop { flex:1; min-height:44px; border:2px dashed #555; border-radius:8px; display:flex; align-items:center; justify-content:center;
          cursor:pointer; color:#aaa; font-size:13px; padding:8px; text-align:center; transition:all .15s; }
  #drop.drag { border-color:#7c83ff; background:#2a2d52; color:#fff; }
  #status { font-size:12px; color:#9aa; }
  #err { color:#ff8080; font-size:12px; white-space:pre-wrap; }
  #view { flex:1; position:relative; }
  #view canvas { display:block; }
  #hint { position:absolute; left:12px; bottom:10px; font-size:11px; color:#889; background:rgba(0,0,0,.5); padding:4px 8px; border-radius:4px; }
  button, select { font-size:12px; padding:3px 10px; border-radius:4px; border:1px solid #444; background:#33365a; color:#eee; cursor:pointer; font-family:inherit; }
  #files { font-size:11px; color:#889; max-height:70px; overflow:auto; width:100%; }
</style>
<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.185.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.185.0/examples/jsm/",
    "@moeru/three-mmd": "https://unpkg.com/@moeru/three-mmd@0.1.1/dist/index.js"
  }
}
</script>
</head>
<body>
<div id="bar">
  <div id="drop">📂 拖拽整个模型文件夹到这里（含 .pmx/.pmd + 纹理 + 可选 .vmd），或点击选择文件</div>
  <input type="file" id="picker" webkitdirectory multiple hidden>
  <button id="clear">清理场景</button>
  <span id="status">未加载</span>
</div>
<div id="err"></div>
<div id="view">
  <div id="hint">🖱 拖拽旋转 · 滚轮缩放 · 右键平移</div>
</div>
<div id="files"></div>

<script type="module">
import * as THREE from "three";
import { OrbitControls } from "three/addons/controls/OrbitControls.js";
import { MMDLoader, VmdObject, buildAnimation } from "@moeru/three-mmd";

const $ = (id) => document.getElementById(id);
const drop = $("drop"), picker = $("picker"), statusEl = $("status"), errEl = $("err"), filesEl = $("files");

let renderer, scene, camera, controls, rafId = 0;
let mmdObj = null, mixer = null, action = null, playing = true;
const blobUrls = [];

function setStatus(msg) { statusEl.textContent = msg; }
function setErr(msg) { errEl.textContent = msg || ""; }

// ---- 渲染外壳 ----
function ensureScene() {
  if (scene) return;
  const view = $("view");
  scene = new THREE.Scene();
  scene.background = new THREE.Color("#1a1b2e");
  camera = new THREE.PerspectiveCamera(50, view.clientWidth / view.clientHeight, 0.05, 5000);
  renderer = new THREE.WebGLRenderer({ antialias: true });
  renderer.setSize(view.clientWidth, view.clientHeight);
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
  view.appendChild(renderer.domElement);
  controls = new OrbitControls(camera, renderer.domElement);
  controls.enableDamping = true;
  scene.add(new THREE.AmbientLight(0xffffff, 0.6));
  const dl = new THREE.DirectionalLight(0xffffff, 1.2);
  dl.position.set(1, 2, 1);
  scene.add(dl);
  scene.add(new THREE.HemisphereLight(0xffffff, 0x444466, 0.4));
  // 参考地面网格
  const grid = new THREE.GridHelper(50, 50, 0x444466, 0x333355);
  scene.add(grid);
  window.addEventListener("resize", () => {
    camera.aspect = view.clientWidth / view.clientHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(view.clientWidth, view.clientHeight);
  });
  const loop = () => {
    rafId = requestAnimationFrame(loop);
    const dt = 1 / 60;
    if (mmdObj) {
      if (mixer) mmdObj.updateWithMixer(dt, mixer, { ik: true, grant: true });
      else mmdObj.update(dt, { ik: true, grant: true });
    }
    controls.update();
    renderer.render(scene, camera);
  };
  loop();
}

function clearScene() {
  if (mmdObj) {
    try { mixer && mixer.stopAllAction(); mmdObj.dispose(); } catch (_) {}
    if (mmdObj.mesh && mmdObj.mesh.parent) mmdObj.mesh.parent.remove(mmdObj.mesh);
    mmdObj = null; mixer = null; action = null;
  }
  for (const u of blobUrls) URL.revokeObjectURL(u);
  blobUrls.length = 0;
  filesEl.textContent = "";
  setStatus("已清理");
  setErr("");
}

$("clear").onclick = clearScene;

drop.onclick = () => picker.click();
drop.ondragover = (e) => { e.preventDefault(); drop.classList.add("drag"); };
drop.ondragleave = () => drop.classList.remove("drag");
drop.ondrop = (e) => {
  e.preventDefault();
  drop.classList.remove("drag");
  handleFiles(e.dataTransfer.files);
};
picker.onchange = () => handleFiles(picker.files);

function handleFiles(fileList) {
  if (!fileList || fileList.length === 0) return;
  setErr("");
  clearScene();
  ensureScene();

  const files = Array.from(fileList);
  // 主文件：优先 .pmx，其次 .pmd
  const modelFile = files.find((f) => /\.pmx$/i.test(f.name)) || files.find((f) => /\.pmd$/i.test(f.name));
  if (!modelFile) {
    setErr("没找到 .pmx/.pmd 主文件——请拖入包含模型文件的文件夹");
    return;
  }

  // basename → blob URL（与 mmd-adapter 同口径：URLModifier 最长后缀匹配）
  const urlMap = new Map();
  for (const f of files) {
    const url = URL.createObjectURL(f);
    blobUrls.push(url);
    const lower = f.name.toLowerCase();
    urlMap.set(lower, url);
    urlMap.set(lower.split(/[\\/]/).pop() || "", url);
  }
  const fileNames = files.map((f) => f.name).join("、");
  filesEl.textContent = "已选 " + files.length + " 个文件：" + fileNames;

  const manager = new THREE.LoadingManager();
  manager.setURLModifier((url) => {
    const lower = url.toLowerCase();
    let best, bestLen = -1;
    for (const [k, v] of urlMap) {
      if (k.length > bestLen && lower.endsWith(k)) { best = v; bestLen = k.length; }
    }
    return best ?? url;
  });

  setStatus("⏳ 加载 " + modelFile.name + " ...");
  const loader = new MMDLoader(manager);
  loader.loadAsync(URL.createObjectURL(modelFile)).then(async (mmd) => {
    mmdObj = mmd;
    const mesh = mmd.mesh;
    scene.add(mesh);
    setStatus("✅ 模型已加载（骨骼 " + mmd.pmx.bones.length + " · 材质 " + mmd.pmx.materials.length + " · 表情 " + mmd.pmx.morphs.length + "）");

    // 包围盒取景
    const box = new THREE.Box3().setFromObject(mesh);
    const size = box.getSize(new THREE.Vector3());
    const center = box.getCenter(new THREE.Vector3());
    const maxDim = Math.max(size.x, size.y, size.z) || 1;
    camera.near = 0.05; camera.far = maxDim * 50;
    camera.position.set(center.x, center.y + size.y * 0.1, center.z + maxDim * 1.6);
    camera.updateProjectionMatrix();
    controls.target.copy(center);
    controls.minDistance = maxDim * 0.1;
    controls.maxDistance = maxDim * 12;
    controls.update();

    // VMD：同目录动作自动播放
    const vmds = files.filter((f) => /\.vmd$/i.test(f.name));
    if (vmds.length > 0) {
      mixer = new THREE.AnimationMixer(mesh);
      for (const vf of vmds) {
        try {
          const buf = await vf.arrayBuffer();
          const vmd = VmdObject.ParseFromBuffer(buf);
          const clip = buildAnimation(vmd, mesh);
          if (!action) { action = mixer.clipAction(clip); action.play(); }
          setStatus(statusEl.textContent + " · 动作: " + vf.name);
        } catch (e) { console.warn("VMD 解析失败:", vf.name, e); }
      }
    }
  }).catch((e) => {
    console.error(e);
    setErr("❌ 模型加载失败: " + (e && e.message ? e.message : String(e)));
    setStatus("加载失败");
  });
}
</script>
</body>
</html>
